[package]
name = "xiic-voice-studio"
version = "0.1.0"
description = "Local-first AI voice script and TTS production studio"
authors = ["xiic"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "xiic_voice_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
docx-rs = "0.4"
quick-xml = "0.38"
regex = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "stream"] }
rusqlite = { version = "0.37", features = ["bundled", "chrono", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zip = "6"
